{% extends "admin/base_site.html" %}
{% block content %}
  <h2>Cambiar categoría de {{ ingredientes.count }} ingredientes</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <!-- 🔹 Campo oculto necesario para recordar los objetos seleccionados -->
    {% for obj_id in selected_ids %}
      <input type="hidden" name="_selected_action" value="{{ obj_id }}">
    {% endfor %}

    <!-- 🔹 Campo oculto que indica qué acción se está ejecutando -->
    <input type="hidden" name="action" value="cambiar_categoria">

    <button type="submit" name="apply" class="default">Aplicar</button>
    <a href=".." class="button cancel-link">Cancelar</a>
  </form>
{% endblock %}
